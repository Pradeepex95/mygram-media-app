name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mygram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mygram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mygram?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mygram?schema=public
      AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMeNow!123
      ADMIN_USERNAME: admin
      CRON_SECRET: ci-cron-secret
      S3_BUCKET: mygram
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      NEXT_PUBLIC_APP_NAME: MyGram
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
