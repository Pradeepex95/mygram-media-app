services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mygram
    ports:
      - "5432:5432"
    volumes:
      - mygram_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mygram"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: if your registry can pull MinIO images, uncomment and set STORAGE_DRIVER=s3
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - mygram_minio:/data

volumes:
  mygram_pg:
  # mygram_minio:
